[project]
name = "dashboard"
version = "0.2.0"
description = "HCMR parts dashboard (Flask) on top of a PostgreSQL warehouse"
readme = "README.md"
authors = [
    { name = "BorodaPetra", email = "124194320+BorodaPetra@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3,<4",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "time-machine>=3.5.1",
    "vl-convert-python>=1.9.0.post1",
]

[tool.ruff.lint]
# errors only (syntax, undefined / unused names, empty f-strings), not style
select = ["E4", "E7", "E9", "F"]
