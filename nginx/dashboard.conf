# nginx in front of gunicorn: static files directly from disk, everything else to the app.
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;              # = MAX_CONTENT_LENGTH of the uploads (config.py)

    location /static/ {
        alias /srv/static/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;           # PartsData on a long list of parts
    }
}
