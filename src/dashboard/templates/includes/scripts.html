<script type="text/javascript" nonce="{{ csp_nonce() }}">
  // CSRF token for every non-GET jQuery request (Flask-WTF CSRFProtect checks X-CSRFToken).
  // A global ajaxSend event, not $.ajaxSetup({beforeSend}): a request with its own
  // beforeSend (the sales filter form) REPLACES the one from ajaxSetup, and lost the token.
  $(document).on("ajaxSend", function (event, xhr, settings) {
    if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
      xhr.setRequestHeader("X-CSRFToken", document.querySelector('meta[name="csrf-token"]').content);
    }
  });
  // <form data-confirm="question"> asks before submitting: CSP blocks inline onsubmit="..."
  document.addEventListener("submit", function (event) {
    const question = event.target.dataset.confirm;
    if (question && !window.confirm(question)) event.preventDefault();
  });
</script>
