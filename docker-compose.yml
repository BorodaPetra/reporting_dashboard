# Dashboard: gunicorn app + nginx in front; PostgreSQL runs outside the compose.
#   docker compose up -d --build          ->  http://localhost:5085
# Needs .env (SECRET_KEY, report settings, mail) and secrets/pgpass (docs/deploy.md).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # the host's PostgreSQL; .env keeps the localhost URL of the dev server
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://dashboard_app@host.docker.internal:5432/hcmr_demo}
      DEBUG: "False"                # ProductionConfig (Secure cookies) even if .env is the dev one
      # "today" of the reports and REPORT_REFRESH_TIME are local time: DOCKER_TZ in .env
      # (not TZ there: python-dotenv would set it for the Windows dev server too)
      TZ: ${DOCKER_TZ:-UTC}
    extra_hosts:
      - "host.docker.internal:host-gateway"     # Docker Desktop has it; on Linux this line adds it
    secrets:
      - pgpass
    volumes:
      - instance:/app/instance        # uploads (tracing.xlsx) survive rebuilds

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "5085:80"
    volumes:
      - ./nginx/dashboard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/dashboard/static:/srv/static:ro
    depends_on:
      - app

secrets:
  pgpass:
    file: ./secrets/pgpass

volumes:
  instance:
